[include mainsail.cfg]
[include macros.cfg]
[exclude_object]
[skew_correction]
[idle_timeout]
timeout: 1800
[force_move]
enable_force_move: true

#####################################################################
##                   Model and Acceleration
#####################################################################

[printer]
kinematics: corexy                        # Printer type: corexy.
max_velocity: 700                     # Maximum speed (max. 300 mm/s).
max_accel: 63000                          # Maximum acceleration (max. 5000 mm/s²).
max_z_velocity: 15                        # Z-axis maximum speed (15 mm/s).
max_z_accel: 3500                         # Z-axis maximum acceleration (350 mm/s²).
square_corner_velocity: 5.0               # Square corner velocity (5.0 mm/s).

#####################################################################
##                      MCU EBBCan
#####################################################################

[mcu EBBCan]
serial:/dev/serial/by-id/usb-Klipper_stm32g0b1xx_3F000D000450315741363420-if00
restart_method: command

#####################################################################
##                        Beacon
#####################################################################

[beacon]
serial:/dev/serial/by-id/usb-Beacon_Beacon_RevH_1C6F0F2D4E5737374D202020FF07180C-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 25.5 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
contact_max_hotend_temperature: 180 # increase to probe at print temps
home_xy_position: 175, 175 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home

[resonance_tester]
accel_chip: beacon             # Specifies ADXL345 accelerometer for resonance testing
probe_points:
    175, 175, 20                # Coordinates of the probe points for resonance testing
#accel_per_hz: 100
#sweeping_accel: 400
#sweeping_period: 0

#[safe_z_home]
#home_xy_position: 175,175                # Example home_xy_position: 175,175 - This would be for a 350 * 350mm bed. 
#z_hop: 10                                # Z axis hop height after homing.

#####################################################################
##                      MCU Octopus
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_23002F001751313430323835-if00

#####################################################################
##                  Temperature Monitoring
#####################################################################

[temperature_sensor STEPPER_X]
sensor_type: Generic 3950
sensor_pin: PB1

[temperature_sensor STEPPER_Y]
sensor_type: Generic 3950
sensor_pin: PC5

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PC4

#[temperature_sensor chamber1]
#sensor_type: Generic 3950
#sensor_pin: PA7

[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBBCan:PA0
pullup_resistor: 2200

[temperature_sensor BTT-MCU]
sensor_type: temperature_mcu             # MCU internal temperature sensor.

[temperature_sensor BTT-PI]
sensor_type: temperature_host            # Host system internal temperature sensor.

#####################################################################
#                        B(X) ---------A(Y)
#                        |                |
#                        |                |
#                        |--------E-------|
#                        |                |
#                        |                |
#                        |                |
#####################################################################
##                   X-axis on MOTOR_0(B Motor)
#####################################################################

[stepper_x]
step_pin: PC14                           # X-axis motor pulse pin setting
dir_pin: !PC13                           # X-axis motor direction pin setting
enable_pin: !PE6                         # X-axis motor enable pin setting
microsteps: 32                           # Motor microsteps setting
rotation_distance: 40                    # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200             # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: tmc5160_stepper_x:virtual_endstop                        # G6 # Limit switch pin setting (X-)
position_min: 0                          # X-axis minimum travel - software limit
position_endstop: 350                    # Mechanical reset point coordinates for X-axis (change to 350 for 350 models)
position_max: 350                        # X-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 100                        # Reset speed - maximum 100
homing_retract_dist: 0                   # Setback distance after the first trigger of the reset switch
homing_positive_dir: true                # Direction of reset (generally no change required)

[tmc5160 stepper_x]
cs_pin: PD6
#spi_bus: spi1
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PC15
run_current: 2.8
sense_resistor: 0.05
stealthchop_threshold: 0
driver_SGT: 2
#driver_TBL: 0
#driver_TOFF: 8
#driver_HSTRT: 5
#driver_HEND: 5
#driver_TPFD: 5
home_current: 1
#####################################################################
##                   Y-axis on MOTOR_1（A Motor）
#####################################################################

[stepper_y]
step_pin: PE5                            # Y-axis motor pulse pin setting
dir_pin: !PE4                            # Y-axis motor direction pin setting
enable_pin: !PE3                         # Y-axis motor enable pin setting
microsteps: 32                           # Motor microsteps setting
rotation_distance: 40                    # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
full_steps_per_rotation: 200             # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: tmc5160_stepper_y:virtual_endstop                        # Limit switch pin setting (Y-)
position_min: -10                        # Y-axis minimum travel - software limit
position_endstop: 350                    # Mechanical reset point coordinates for Y-axis (change to 350 for 350 models)
position_max: 350                        # Y-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 100                        # Reset speed - maximum 100
homing_retract_dist: 0                   # Setback distance after the first trigger of the reset switch
homing_positive_dir: true                # Direction of reset (generally no change required)

[tmc5160 stepper_y]
cs_pin: PD5
#spi_bus: spi1
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
diag1_pin: ^!PF0
run_current: 2.8
sense_resistor: 0.05
stealthchop_threshold: 0
driver_SGT: -64
#driver_TBL: 0
#driver_TOFF: 8
#river_HSTRT: 5
#river_HEND: 5
#driver_TPFD: 5
home_current: 1
####################################################################################
#                          z1 -------------- z2
#                          |                 |
#                          |                 |
#                          |                 |
#   |                 |
#                          |                 |
#                          |                 |
#                         z0---   display ---z3
#####################################################################
##                  Z0-axis on MOTOR_2 (left front)
#####################################################################

[stepper_z]
step_pin: PG9    		                    # Z-axis motor pulse pin
dir_pin: !PG10                              # Z-axis motor direction pin setting
enable_pin: !PG13                           # Z-axis motor enable pin setting
rotation_distance: 40                       # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16                           # reduction ratio
microsteps: 32                              # microsteps
endstop_pin: probe:z_virtual_endstop        # Limit switch interface
position_max: 340                           # Maximum Z-axis print height   350mm=340
position_min: -5                            # Soft Limit Minimum Stroke
homing_speed: 50                            # Reset speed - maximum 20
second_homing_speed: 3                      # Secondary reset speed - maximum 10
homing_retract_dist: 0                      # Retreat distance
 
#--------------------------------------------------------------------

[tmc5160 stepper_z]
cs_pin: PD2
#spi_bus: spi1
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 999999

#####################################################################
##                  Z1-axis on MOTOR_3 (left rear)
#####################################################################

[stepper_z1]
step_pin: PG11                              # Z1-axis motor pulse pin setting
dir_pin: PD7                                # Z1-axis motor direction pin setting
enable_pin: !PG12                           # Z1-axis motor enable pin setting
rotation_distance: 40                       # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16                           # Reduction ratio
microsteps: 32                              # Motor microsteps setting

#--------------------------------------------------------------------

[tmc5160 stepper_z1]
cs_pin: PA15
#spi_bus: spi1
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 999999

#####################################################################
##                  Z2-axis on MOTOR_4 (right rear)
#####################################################################

[stepper_z2]
step_pin: PB4                            # Z2-axis motor pulse pin setting
dir_pin: !PB3                            # Z2-axis motor direction pin setting
enable_pin: !PB5                         # Z2-axis motor enable pin setting
rotation_distance: 40                    # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16                        # Reduction ratio
microsteps: 32                           # Motor microsteps setting

#--------------------------------------------------------------------

[tmc5160 stepper_z2]
cs_pin: PA9
#spi_bus: spi1
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 999999

#####################################################################
##                  Z3-axis on MOTOR_5 (right front)
#####################################################################

[stepper_z3]
step_pin: PG15                           # Z3-axis motor pulse pin setting
dir_pin: PB6                             # Z3-axis motor direction pin setting
enable_pin: !PG14                        # Z3-axis motor enable pin setting
rotation_distance: 40                    # Active pulley circumference in mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16                        # Reduction ratio
microsteps: 32                           # Motor microsteps setting

#--------------------------------------------------------------------

[tmc5160 stepper_z3]
cs_pin: PA10
#spi_bus: spi1
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 0.800
sense_resistor: 0.075
stealthchop_threshold: 999999

#####################################################################
##                  Extruder motor
#####################################################################

[extruder]
step_pin: EBBCan:PB14                 # Step pin
dir_pin: EBBCan:PA8                   # Direction pin, "!" indicates logic inversion
enable_pin: !EBBCan:PB6               # Enable pin, "!" indicates logic inversion
full_steps_per_rotation: 200          # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
microsteps: 16                        # Microsteps setting
gear_ratio: 50:10                     # Gear ratio
rotation_distance: 22.843869122787    # Rotation distance
nozzle_diameter: 0.400                # Nozzle diameter
filament_diameter: 1.750              # Filament diameter
heater_pin: PF8                       # Heater pin
min_temp: -20                         # Minimum temperature
max_temp: 450                         # Maximum temperature
min_extrude_temp: 170                 # Minimum extrude temperature
pressure_advance: 0.028               # Pressure advance - try to keep pressure below 1.0
pressure_advance_smooth_time: 0.030   # Pressure advance smooth time - default is 0.040
sensor_type: PT1000
sensor_pin: EBBCan:PA3
pullup_resistor: 2200
max_extrude_cross_section: 5
#control: mpc
heater_power: 50  
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 

#--------------------------------------------------------------------

[verify_heater extruder]             # Heater block temperature tolerance configuration
max_error: 120                       # Maximum error
check_gain_time: 120                 # Tolerance time
hysteresis: 50                       # Tolerance temperature
heating_gain: 2                      # Heating gain

#--------------------------------------------------------------------

[tmc2209 extruder]
uart_pin: EBBCan:PB3
run_current: 0.650
stealthchop_threshold: 999999
sense_resistor: 0.110

#####################################################################
##                  Heater_bed
#####################################################################

[heater_bed]
heater_pin: PF7                          # (HE1)
sensor_pin: PB0                          # sensor interface(TB)
sensor_type: ATC Semitec 104GT-2	       # ATC Semitec 104GT-2
min_temp: 0                              # Minimum temperature threshold
max_temp: 120                            # Maximum temperature threshold
max_power: 1.0                           # Maximum power for the heater or fan

#####################################################################
# 	                   Bed Grid Calibration
#####################################################################

[bed_mesh]
zero_reference_position: 175,175  
speed: 200
horizontal_move_z: 3
mesh_min: 30, 30
mesh_max: 320, 320
probe_count: 11, 11
adaptive_margin: 10
mesh_pps: 0,0

#####################################################################
#                  FAN
#####################################################################

[multi_pin hotend_fan]
pins: PA2, PA3

[fan]                                   # Parts Cooling Fan 
pin:multi_pin: hotend_fan               # Fan pin 
hardware_pwm: false                     # hardware pwm
max_power: 1.0

#--------------------------------------------------------------------

[heater_fan hotend_fan]                 # hotend fan
pin: PA1                        # Hotend fan pin
heater: extruder                        # Associated heating device
heater_temp: 50.0                       # Temperature to start the fan
tachometer_pin: ^EBBCan:PA4

#--------------------------------------------------------------------

[controller_fan mc_fan1]                # Skirt fan
pin: PA4                                 # Pin for Skirt fan
kick_start_time: 0.5                     # Start-up time for the fan (do not change)
heater: heater_bed                       # Heater associated with this fan
stepper: stepper_x, stepper_y, extruder
idle_timeout: 120

#--------------------------------------------------------------------

[controller_fan stepper]                
pin: PA5                                 
kick_start_time: 0.5                     # Start-up time for the fan (do not change)
heater: heater_bed                       # Heater associated with this fan
stepper: stepper_x, stepper_y, extruder
idle_timeout: 120

#--------------------------------------------------------------------

[output_pin bedfans]            # under bed fans
pin: PA0                                
value: 0
shutdown_value: 0   

####################################################################################
##                          Gantry Leveling Settings
####################################################################################

[quad_gantry_level]
gantry_corners:                          # Coordinates for the gantry corners
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
	300,25
speed: 400                               # Levelling speed in mm/min
horizontal_move_z: 4                     # Z-axis height for horizontal moves
retries: 10                               # Number of retries for out-of-tolerance adjustments
retry_tolerance: 0.01                    # Tolerance for retrying
max_adjust: 15                           # Maximum adjustment stroke for leveling

[axis_twist_compensation]
#speed: 50
#   The speed (in mm/s) of non-probing moves during the calibration.
#   The default is 50.
#horizontal_move_z: 5
#   The height (in mm) that the head should be commanded to move to
#   just prior to starting a probe operation. The default is 5.
calibrate_start_x: 30
#   Defines the minimum X coordinate of the calibration
#   This should be the X coordinate that positions the nozzle at the starting
#   calibration position.
calibrate_end_x: 320
#   Defines the maximum X coordinate of the calibration
#   This should be the X coordinate that positions the nozzle at the ending
#   calibration position.
calibrate_y: 175
#   Defines the Y coordinate of the calibration
#   This should be the Y coordinate that positions the nozzle during the
#   calibration process. This parameter is recommended to
#   be near the center of the bed


#####################################################################
##                       Input Shaper
#####################################################################

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
show_macros_in_webui: True
timeout: 600
measurements_chunk_size:2
max_freq: 200
dpi: 250

[input_shaper]
shaper_freq_x: 86.2 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 59.6 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.045 # damping ratio for the X axis
damping_ratio_y: 0.058 # damping ratio for the Y axis

#####################################################################
##                      TMC AutoTune
#####################################################################

[autotune_tmc stepper_x]
motor: ldo-42sth60-3004ac

[autotune_tmc stepper_y]
motor: ldo-42sth60-3004ac

[autotune_tmc stepper_z]
motor: omc-17hs19-2004s1-h

[autotune_tmc stepper_z1]
motor: omc-17hs19-2004s1-h

[autotune_tmc stepper_z2]
motor: omc-17hs19-2004s1-h

[autotune_tmc stepper_z3]
motor: omc-17hs19-2004s1-h

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg

